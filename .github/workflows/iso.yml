name: Build bootable ISO
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iso.yml'
      - 'live/**'
      - 'scripts/build_iso.sh'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build in Debian Trixie (current live-build)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work debian:trixie bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debootstrap xorriso squashfs-tools \
                syslinux-utils isolinux grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates
              ./scripts/build_iso.sh
            '
      - name: Verify live account in built root filesystem
        run: |
          sudo unsquashfs -cat live/binary/live/filesystem.squashfs etc/passwd | grep -E '^user:[^:]*:[0-9]+:'
          sudo unsquashfs -cat live/binary/live/filesystem.squashfs etc/group | grep -E '^autologin:'
          sudo unsquashfs -cat live/binary/live/filesystem.squashfs etc/shadow | awk -F: '$1=="user" && $2 !~ /^(!|\\*)/ {ok=1} END {exit !ok}'
      - name: Generate SHA256 checksum
        run: |
          cd live
          ls -lh *.iso
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: usb-pc-inspector-amd64-iso
          path: |
            live/*.iso
            live/SHA256SUMS
          retention-days: 7

name: Build bootable ISO
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iso.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build in Debian Trixie (current live-build)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work debian:trixie bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debootstrap xorriso squashfs-tools \
                syslinux-utils isolinux grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates
              ./scripts/build_iso.sh
            '
      - name: Generate SHA256 checksum
        run: |
          cd live
          ls -lh *.iso
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: usb-pc-inspector-amd64-iso
          path: |
            live/*.iso
            live/SHA256SUMS
          retention-days: 7
